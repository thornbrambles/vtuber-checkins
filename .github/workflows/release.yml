name: Package Streamer.bot release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/credit-policy-tests.yml
    permissions:
      contents: read
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package release
        run: python tools/package-release.py "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME"
