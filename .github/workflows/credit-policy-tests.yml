name: Check-in reliability tests

on:
  push:
    branches: [main, refactor/wheel-ledger-and-commands]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q tools tests
      - name: Validate centralized milestone and command config
        run: python tools/sync-config.py --check
      - name: Run policy, backup, reconciliation and sandbox tests
        run: python -m unittest discover -s tests -v
      - name: Validate actual OBS wheel animation script (Node built-in test runner)
        run: node --test tests/test-wheel-overlay.mjs

  csharp-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile each C# action against documented API-shaped stubs
        run: python tools/compile-actions.py
      - name: Exercise actual C# actions with interrupted writes and event retries
        run: python tools/test-actions.py
